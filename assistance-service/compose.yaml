version: "3.8"
services:
  postgres:
    image: 'ankane/pgvector:v0.5.0'
    restart: always
    environment:
      - 'POSTGRES_DB=vector_store'
      - 'POSTGRES_PASSWORD=Senemomo'
      - 'POSTGRES_USER=postgres'
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '5442:5432'
    expose:
      - '5442'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vector_store"]
      interval: 2s
      timeout: 20s
      retries: 10
      start_period: 10s
  pgadmin:
    container_name: pgadmin-container
    image: 'dpage/pgadmin4'
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=senemamadou1999@gmail.com'
      - 'PGADMIN_DEFAULT_PASSWORD=admin'
    volumes:
      - './servers.json:/pgadmin4/servers.json'
    ports:
      - '${PGADMIN_PORT:-5050}:80'

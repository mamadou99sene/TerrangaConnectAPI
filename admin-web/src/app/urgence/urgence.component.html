<app-appbar></app-appbar>
<app-sidebar></app-sidebar>
<div class="col-lg-12">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Declarations d'urgences</h5>
      <table class="table">
        <thead>
        <tr>
          <th>Demandeur</th>
          <th>titre</th>
          <th>lieu</th>
          <th>type</th>
          <th>Montant requis</th>
          <th>Validation</th>
          <th>Details</th>
        </tr>
        </thead>
        <tbody>
          @for (urgence of listUrgences(); track urgence.id) {
            <tr>
              <td>{{urgence.demandeur.email}}</td>
              <td>{{urgence.titre}}</td>
              <td>
                <i class="bi bi-geo-alt-fill me-1 text-warning"></i>
                {{urgence.lieu}}
              </td>
              <td>{{urgence.type}}</td>
              <td class="bg bg-light text-success">{{urgence.montantRequis}} FCFA</td>
              <td>
                <button 
                  class="btn btn-sm" 
                  [ngClass]="{
                    'btn-outline-success': urgence.status === 'VALIDATED',
                    'btn-danger': urgence.status === 'PENDING'
                  }" 
                  (click)="valider(urgence)">
                  @if (urgence.status === 'VALIDATED') {
                    <i class="bi bi-check text-success fs-5"></i>
                  } @else {
                    <i class="bi bi-x text-white fs-5"></i>
                  }
                </button>
              </td>
              <td> <button (click)="navigatedetailsUrgence(urgence)"> <i class="bi bi-geo-alt-fill"></i></button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

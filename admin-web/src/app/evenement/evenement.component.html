<div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Declarations d'événement</h5>
        <table class="table">
          <thead>
          <tr>
            <th>Demandeur</th>
            <th>titre</th>
            <th>lieu</th>
            <th>type</th>
            <th>Date</th>
            <th>Validation</th>
          </tr>
          </thead>
          <tbody>
            @for (evenement of listEvenements; track evenement.id) {
              <tr>
                <td>{{evenement.demandeur.email}}</td>
                <td>{{evenement.titre}}</td>
                <td>{{evenement.lieu}}</td>
                <td>{{evenement.type}}</td>
                <td>du {{evenement.dateDebut}} au {{evenement.dateFin}}</td>
                <td>
                  <button 
                    class="btn btn-sm" 
                    [ngClass]="{
                      'btn-outline-success': evenement.status === 'VALIDATED',
                      'btn-danger': evenement.status === 'PENDING'
                    }" 
                    (click)="validerEvenement(evenement)">
                    @if (evenement.status === 'VALIDATED') {
                      <i class="bi bi-check text-success fs-5"></i>
                    } @else {
                      <i class="bi bi-x text-white fs-5"></i>
                    }
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>

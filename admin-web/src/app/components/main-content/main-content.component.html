<div class="body">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <img src="" alt="user" width="30" height="30" class="rounded-circle">
        <a class="navbar-brand ms-2" href="#">Teranga Connect</a>
        <button class="btn btn-dark" (click)="toggleSidebar()">
          <i class="bi bi-list fs-4"></i>
        </button>

      <div class="ms-auto d-flex align-items-center">
        <div class="user-profile text-white dropdown">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" 
             id="dropdownUserContracts" 
             data-bs-toggle="dropdown" 
             aria-expanded="false">
            <i class="bi bi-person-circle text-white fs-4 me-2"></i>
            <span>{{ user.username }}</span>
          </a>
        </div>
      </div>
      </div>
    </nav>
  
    <!-- Main Container -->
    <div class="container-fluid main-container">
      <div class="row">
        <!-- Sidebar -->
          <div class="bg-dark text-white sidebar" [class.collapsed]="isCollapsed">
            <div class="d-flex flex-column px-3 pt-2">
              <ul class="nav flex-column">
                <li class="nav-item">
                  <a href="#" class="nav-link text-white">
                    <i class="bi bi-house"></i>
                    <span class="ms-2">Home</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link text-white active">
                    <i class="bi bi-graph-up"></i>
                    <span class="ms-2">Dashboard</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a (click)="navigateUrgences()" class="nav-link text-white">
                    <i class="bi bi-credit-card-2-front"></i>
                    <span class="ms-2">Urgences sociales</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a (click)="navigateDemandes()" class="nav-link text-white">
                    <i class="bi bi-grid"></i>
                    <span class="ms-2">Demande don de sang</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a (click)="navigateEvents()" class="nav-link text-white">
                    <i class="bi bi-people"></i>
                    <span class="ms-2">Evénements</span>
                  </a>
                </li>
              </ul>

              <hr>
              <div class="dropdown pb-4 fixed-bottom">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" 
                  id="dropdownUser1" 
                  data-bs-toggle="dropdown" 
                  aria-expanded="false">
                  <img src="" width="30" height="30" class="rounded-circle">
                  <span class="ms-2">Options</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark shadow">
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="bi bi-star"></i>
                      <span class="ms-2">Preferences</span>
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="bi bi-gear"></i>
                      <span class="ms-2">Parametres</span>
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="bi bi-person"></i>
                      <span class="ms-2">Profile</span>
                    </a>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <a class="dropdown-item d-flex align-items-center" (click)="deconnexion()">
                      <i class="bi bi-power"></i>
                      <span class="ms-2">Deconnexion</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
  
        <!-- Main Content -->
        <div class="main-content" [class.expanded]="isCollapsed">
          <router-outlet>
           
          </router-outlet>
        </div>
      </div>
    </div>
  </div>
